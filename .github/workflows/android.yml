name: Build apps (Android APK + Windows .exe)

# Three ways in, so whichever feels natural works:
#   * Publish a release from the GitHub website (any tag name)
#   * git tag v1.0.0 && git push --tags
#   * Actions -> Build APK -> Run workflow
#
# The original only listened for tags beginning with "v", which meant
# publishing a release named "1.0.0" from the website quietly did nothing at
# all — a release appeared, no build ran, and nothing said why.
on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version / tag (e.g. 1.0.0). An existing tag gets the APK attached to its release.'
        required: false
        default: ''

# Publishing a release from the website fires both a tag push and a release
# event, so without this the same APK would be built twice, in parallel,
# racing to attach itself to one release.
concurrency:
  group: apps-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write        # needed to create the release

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      name: ${{ steps.ver.outputs.name }}
      semver: ${{ steps.ver.outputs.semver }}
      stable: ${{ steps.signing.outputs.stable }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The android-actions/setup-android action is deliberately not used here.
      # It tries to install a legacy SDK package called "tools" that Google has
      # since removed from the repository, so it fails outright with
      # "Failed to find package 'tools'". It was never needed in the first
      # place: GitHub's Ubuntu runners ship the Android SDK preinstalled, so
      # this just points at it and adds the two packages this build wants.
      - name: Point at the preinstalled Android SDK
        run: |
          set -uo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "::error::No Android SDK found at $SDK"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK"      >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK"  >> "$GITHUB_ENV"

          # cmdline-tools is versioned, and the version moves with the runner
          # image, so find it rather than hardcoding a path that will rot.
          SDKMANAGER="$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK/cmdline-tools"
            exit 1
          fi
          echo "Using $SDKMANAGER"

          # Licences are normally pre-accepted on the runner; this is a no-op
          # when they are, and harmless when they aren't.
          yes 2>/dev/null | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          echo "SDK ready at $SDK"

      - name: Work out the version
        id: ver
        # Passed as env rather than inlined into the script, so a stray quote
        # in a typed version can't break (or inject into) the shell.
        env:
          REL_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$REL_TAG" ]; then
            TAG="$REL_TAG"                 # published from the website
          elif [ -n "$INPUT_VERSION" ]; then
            TAG="$INPUT_VERSION"           # typed into "Run workflow"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"         # pushed tag
          else
            TAG="build-$GITHUB_RUN_NUMBER" # plain manual run
          fi
          NAME="${TAG#v}"
          # Android refuses an update whose versionCode is lower than the one
          # installed, so it has to rise on every build. The run number does
          # that without needing any state kept between builds.
          CODE="${GITHUB_RUN_NUMBER}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          # The Windows build needs a strict x.y.z version; anything else
          # (e.g. "build-12") becomes 0.0.<run number>.
          if echo "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then SEMVER="$NAME"; else SEMVER="0.0.$GITHUB_RUN_NUMBER"; fi
          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "Building $NAME as tag $TAG (code $CODE)"

      - name: Prepare signing key
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KS="$RUNNER_TEMP/keys/release.jks"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "Using the keystore from repository secrets."
          else
            # No secret configured: generate a throwaway key so the build still
            # produces an installable APK. The catch is that the signature
            # differs every run, so Android treats each build as a different
            # app and refuses to install it over the last one. Fine for a first
            # try, worth fixing before you rely on it.
            keytool -genkeypair -v -keystore "$KS" \
              -alias musicarchive -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass temporary -keypass temporary \
              -dname "CN=Music Archive, OU=Personal, O=Music Archive, C=AU"
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No KEYSTORE_BASE64 secret set — signing with a throwaway key. Updates will not install over a previous build."
          fi
          echo "path=$KS" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'temporary' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'musicarchive' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'temporary' }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace \
            -PappVersionName="${{ steps.ver.outputs.name }}" \
            -PappVersionCode="${{ steps.ver.outputs.code }}"

      - name: Rename the APK
        id: apk
        run: |
          SRC=$(find android/app/build/outputs/apk/release -name "*.apk" | head -1)
          if [ -z "$SRC" ]; then echo "No APK produced"; exit 1; fi
          DEST="MusicArchive-${{ steps.ver.outputs.name }}.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicArchive-apk
          path: ${{ steps.apk.outputs.path }}
          retention-days: 90

  windows:
    name: Windows .exe
    needs: build              # reuses the version worked out above
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Build installer and portable .exe
        working-directory: desktop
        shell: bash
        env:
          # No code-signing certificate: don't go looking for one.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci
          npm version "${{ needs.build.outputs.semver }}" --no-git-tag-version --allow-same-version
          npx electron-builder --win --publish never
          ls -la dist

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: MusicArchive-windows
          path: |
            desktop/dist/*.exe
          retention-days: 90

  release:
    name: Publish release
    needs: [build, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Collect the builds
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - run: ls -la out

      # One publish step for both, so the APK and the .exe never race each
      # other to create the same release.
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: Music Archive ${{ needs.build.outputs.name }}
          files: out/*
          draft: false
          prerelease: false
          body: |
            **Music Archive ${{ needs.build.outputs.name }}**

            **Android** — download the `.apk` on your phone and open it to
            install. Android will ask you to allow installing from your
            browser the first time; that's expected for an app that doesn't
            come from the Play Store.

            **Windows** — `MusicArchive-Setup-….exe` installs it with Start
            menu and desktop shortcuts. `…-portable.exe` runs without
            installing. Both share one sign-in. Windows SmartScreen will warn
            the first time because the app isn't code-signed: click
            **More info → Run anyway**.

            ${{ needs.build.outputs.stable == 'false' && '> ⚠️ The APK is signed with a throwaway key because no `KEYSTORE_BASE64` secret is set, so it will not install over a previous one. See the README to fix that.' || '' }}

            Both apps load the live site, so day-to-day changes to
            `index.html` show up without reinstalling. You only need a new
            download when the app shell itself changes.
